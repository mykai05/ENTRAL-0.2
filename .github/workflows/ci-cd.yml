name: CI/CD

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: entral_phase150_ci
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Audit production dependencies for critical vulnerabilities
        run: pnpm audit --prod --audit-level critical
      - name: Report high dependency audit findings
        run: pnpm audit --audit-level high
        continue-on-error: true
      - name: Verify and retain production dependency license inventory
        run: pnpm test:phase195:licenses
      - run: pnpm test:release-positioning
      - run: pnpm test:phase160
      - name: Verify Phase 180 isolated 500-business and 10000-entity scale gate
        run: pnpm test:phase180
      - name: Verify Phase 195 contracts, production-only rules, and release gates
        run: pnpm test:phase195
      - name: Verify Phase 196 single-writer Governor, recovery, and review gateway
        run: pnpm test:phase196
      - name: Verify Phase 197 deterministic release controller and rollback containment
        run: pnpm test:phase197
      - name: Verify Phase 198 evidence queue and controlled phase amendments
        run: pnpm test:phase198
      - name: Verify Phase 199 baseline candidate, fail-closed secrets, and review block
        run: pnpm test:phase199
      - name: Verify Phase 200 canonical interaction layer
        run: pnpm test:phase200
      - name: Verify Phase 202 identity, tenancy, session, secret, and support boundaries
        run: pnpm test:phase202
      - name: Build shared contracts for runtime imports
        run: pnpm --filter @entral/contracts build
      - name: Verify Phase 195 runtime safety and graph observability routes
        run: >-
          pnpm --filter @entral/backend exec vitest run
          tests/phase195RuntimeSafety.test.ts
          tests/phase195GraphTelemetryRoutes.test.ts
      - name: Verify Phase 150 through 195 PostgreSQL gates
        env:
          RUN_POSTGRES_INTEGRATION: "1"
          TEST_DATABASE_URL: postgresql://postgres:entral_phase150_ci@127.0.0.1:5432/postgres
        run: >-
          pnpm --filter @entral/backend exec vitest run
          tests/canonicalControlPlanePostgres.integration.test.ts
          tests/memberSeatPostgres.integration.test.ts
          tests/phase150DatabaseAccess.integration.test.ts
          tests/phase160CanonicalTaxonomyPostgres.integration.test.ts
          tests/phase170CanonicalPortfolioPostgres.integration.test.ts
          tests/phase190EntityLifecyclePostgres.integration.test.ts
          tests/phase195CanonicalPersistencePostgres.integration.test.ts
      - name: Verify Phase 202 PostgreSQL tenant and worker boundaries
        env:
          DATA_ENCRYPTION_KEY: phase202-ci-integration-encryption-key
          DATA_ENCRYPTION_KEY_VERSION: phase202-ci
          RUN_POSTGRES_INTEGRATION: "1"
          SECRET_BROKER_ENVIRONMENT: DEVELOPMENT
          TEST_DATABASE_URL: postgresql://postgres:entral_phase150_ci@127.0.0.1:5432/postgres
        run: >-
          pnpm --filter @entral/backend exec vitest run
          tests/phase202IdentityTenancyPostgres.integration.test.ts
          tests/phase202TenantWorker.integration.test.ts
      - name: Verify migrated-account Phase 203 production graph recovery
        env:
          RUN_POSTGRES_INTEGRATION: "1"
          TEST_DATABASE_URL: postgresql://postgres:entral_phase150_ci@127.0.0.1:5432/postgres
        run: pnpm test:phase203:graph-recovery
      - name: Verify Phase 195 backup, restore, forward recovery, and restart
        env:
          PHASE195_RECOVERY_GATE_CONFIRM: DISPOSABLE_ONLY
        run: pnpm test:phase195:recovery
      - run: pnpm lint
      - run: pnpm test
      - name: Verify login, canonical Dashboard, business detail, and phone layout
        env:
          E2E_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: pnpm test:e2e
      - name: Retain Phase 180 browser-scale evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-180-browser-scale
          path: test-results/e2e/phase180-scale.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain Phase 195 browser and release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-195-release-evidence
          path: |
            test-results/e2e/phase195-*.json
            test-results/e2e/phase195-*.png
            test-results/phase195/**
          if-no-files-found: warn
          retention-days: 90
      - name: Retain Phase 196 Governor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-196-governor-evidence
          path: |
            test-results/phase196/**
            .entral/governor/releases/phase-196.json
          if-no-files-found: warn
          retention-days: 90
      - name: Retain Phase 197 release-controller evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-197-release-controller-evidence
          path: |
            test-results/phase197/**
            .entral/governor/release-control/phase-197/**
            .entral/governor/releases/phase-197.json
          if-no-files-found: warn
          retention-days: 90
      - name: Retain Phase 198 improvement-queue evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-198-improvement-queue-evidence
          path: |
            test-results/phase198/**
            .entral/governor/improvements/cycles/**
            .entral/governor/improvements/amendments/**
            .entral/governor/improvements/outcomes/**
          if-no-files-found: warn
          retention-days: 90
      - name: Retain Phase 202 identity and tenancy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-202-identity-tenancy-evidence
          path: |
            test-results/phase202/**
            docs/evidence/phase202/**
          if-no-files-found: warn
          retention-days: 90
      - run: pnpm build
      - run: pnpm release:check
      - name: Verify build did not modify tracked sources
        run: git diff --exit-code

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.VERCEL_ACTIONS_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx --yes vercel@56.5.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@56.5.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@56.5.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
