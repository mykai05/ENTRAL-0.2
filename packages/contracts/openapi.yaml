openapi: 3.1.0
info:
  title: ENTRAL implemented member API
  version: 1.0.0
  description: >
    Gate 130 contract surface. Only paths with complete backend behavior are
    included; future canonical control-plane paths are intentionally absent.
paths:
  /api/v1/member/organizations:
    get:
      operationId: listMemberOrganizations
      summary: List organizations available to the authenticated member.
      responses:
        "200":
          description: Member organization list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOrganizationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/member/organizations/{organizationId}/overview:
    get:
      operationId: getMemberOrganizationOverview
      summary: Get the approved member-visible organization overview.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Approved organization overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The organization is absent or outside the caller's scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    MemberOrganizationRole:
      type: string
      enum: [MEMBER, OWNER]
    MemberCommandRank:
      type: string
      enum: [ENTRAL, MARSHAL, GENERAL, COMMANDER, SOLDIER]
    MemberCommandStatus:
      type: string
      enum: [error, idle, offline, thinking, waiting, working]
    MemberCommandNode:
      type: object
      additionalProperties: false
      required: [id, name, parentId, rank, status]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        name: { type: string, minLength: 1, maxLength: 200 }
        parentId: { type: [string, "null"] }
        rank: { $ref: "#/components/schemas/MemberCommandRank" }
        status: { $ref: "#/components/schemas/MemberCommandStatus" }
    MemberCommandHierarchy:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/MemberCommandNode" }
    MemberOrganization:
      type: object
      additionalProperties: false
      required: [id, joinedAt, memberCount, memberLimit, name, role, slug]
      properties:
        id: { type: string }
        joinedAt: { type: string, format: date-time }
        memberCount: { type: integer, minimum: 0 }
        memberLimit: { type: integer, minimum: 1, maximum: 5 }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
        slug: { type: string }
    MemberOrganizationsResponse:
      type: object
      additionalProperties: false
      required: [organizations, user]
      properties:
        organizations:
          type: array
          items: { $ref: "#/components/schemas/MemberOrganization" }
        user:
          type: object
          additionalProperties: false
          required: [email, id, name]
          properties:
            email: { type: string, format: email, maxLength: 320 }
            id: { type: string }
            name: { type: string, minLength: 1, maxLength: 160 }
    MemberAvailability:
      type: object
      additionalProperties: false
      required: [available, reason]
      properties:
        available: { type: boolean, const: false }
        reason: { type: string, minLength: 1, maxLength: 500 }
        state: { type: string, enum: [not_configured] }
    MemberRecord:
      type: object
      additionalProperties: false
      required: [id, joinedAt, name, role]
      properties:
        id: { type: string, minLength: 1 }
        joinedAt: { type: string, format: date-time }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
    MemberOverviewOrganization:
      type: object
      additionalProperties: false
      required: [id, memberCount, memberLimit, name, role, slug]
      properties:
        id: { type: string, minLength: 1 }
        memberCount: { type: integer, minimum: 0 }
        memberLimit: { type: integer, minimum: 1, maximum: 5 }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
        slug: { type: string, minLength: 1, maxLength: 160 }
    MemberTask:
      type: object
      additionalProperties: false
      required: [assignedTo, dueDate, id, status, title, updatedAt]
      properties:
        assignedTo:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1, maxLength: 160 }
        dueDate: { type: [string, "null"], format: date-time }
        id: { type: string, minLength: 1 }
        status: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 500 }
        updatedAt: { type: string, format: date-time }
    MemberTaskSummary:
      type: object
      additionalProperties: false
      required: [done, inProgress, overdue, todo, total]
      properties:
        done: { type: integer, minimum: 0 }
        inProgress: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
        todo: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    MemberBusinessHealth:
      type: object
      additionalProperties: false
      required: [score, status, summary]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [stable, watch, attention] }
        summary: { type: string, minLength: 1, maxLength: 500 }
    MemberObjective:
      type: object
      additionalProperties: false
      required: [id, priority, progress, status, title]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: string, enum: [high, medium, low] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [planned, active, complete] }
        title: { type: string, minLength: 1, maxLength: 180 }
    MemberFinding:
      type: object
      additionalProperties: false
      required: [detail, id, recommendation, severity, title]
      properties:
        detail: { type: string, minLength: 1, maxLength: 1000 }
        id: { type: string, minLength: 1, maxLength: 80 }
        recommendation: { type: string, minLength: 1, maxLength: 1000 }
        severity: { type: string, enum: [information, opportunity, risk] }
        title: { type: string, minLength: 1, maxLength: 180 }
    MemberMonthlyOperatingSummary:
      type: object
      additionalProperties: false
      required: [accomplishments, headline, nextPriorities, period, summary]
      properties:
        accomplishments:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 240 }
        headline: { type: string, minLength: 1, maxLength: 180 }
        nextPriorities:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 240 }
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        summary: { type: string, minLength: 1, maxLength: 1500 }
    MemberWorkspace:
      type: object
      additionalProperties: false
      required:
        - businessHealth
        - findingsAndRecommendations
        - monthlyOperatingSummary
        - objectivesAndPriorities
        - publishedAt
        - version
      properties:
        businessHealth:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberBusinessHealth" }
        commandHierarchy:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberCommandHierarchy" }
        findingsAndRecommendations:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MemberFinding" }
        monthlyOperatingSummary:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberMonthlyOperatingSummary" }
        objectivesAndPriorities:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/MemberObjective" }
        publishedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    MemberOverviewResponse:
      type: object
      additionalProperties: false
      required: [availability, members, organization, recentTasks, taskSummary, workspace]
      properties:
        availability:
          type: object
          additionalProperties: false
          required: [subscription]
          properties:
            subscription: { $ref: "#/components/schemas/MemberAvailability" }
        members:
          type: array
          items: { $ref: "#/components/schemas/MemberRecord" }
        organization: { $ref: "#/components/schemas/MemberOverviewOrganization" }
        recentTasks:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/MemberTask" }
        taskSummary: { $ref: "#/components/schemas/MemberTaskSummary" }
        workspace:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberWorkspace" }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
