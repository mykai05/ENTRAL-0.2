openapi: 3.1.0
info:
  title: ENTRAL implemented API
  version: 1.2.0
  description: >
    Gate 170 contract surface. Only paths with complete backend behavior are
    included. Canonical control-plane paths require internal Admin
    authentication. Member portfolio paths require organization membership;
    PostgreSQL row-level security resolves Human portfolio or assigned scope.
paths:
  /api/v1/member/organizations:
    get:
      operationId: listMemberOrganizations
      summary: List organizations available to the authenticated member.
      responses:
        "200":
          description: Member organization list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOrganizationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/member/organizations/{organizationId}/overview:
    get:
      operationId: getMemberOrganizationOverview
      summary: Get the approved member-visible organization overview.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Approved organization overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/portfolio/summary:
    get:
      operationId: getMemberCanonicalPortfolio
      summary: Get lightweight canonical business summaries in the member's RLS-visible scope.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Scoped canonical portfolio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalPortfolioSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/businesses/{businessId}/full:
    get:
      operationId: getMemberCanonicalBusinessFull
      summary: Get a full canonical business record on demand when visible to the member.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/BusinessId"
      responses:
        "200":
          description: Full canonical business record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalBusinessFullResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/events:
    get:
      operationId: listMemberCanonicalPortfolioEvents
      summary: List minimal canonical event metadata used to invalidate member portfolio caches.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AfterSequence"
      responses:
        "200":
          description: Scoped canonical events after the supplied cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalPortfolioEvents" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/control-plane/hierarchy:
    get:
      operationId: listCanonicalHierarchy
      summary: List canonical ENTRAL hierarchy entities from PostgreSQL.
      responses:
        "200":
          description: Canonical hierarchy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entities]
                properties:
                  entities:
                    type: array
                    items: { $ref: "#/components/schemas/CanonicalEntitySummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/control-plane/businesses:
    get:
      operationId: listCanonicalBusinesses
      summary: List canonical ENTRAL businesses from PostgreSQL.
      responses:
        "200":
          description: Canonical businesses.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [businesses]
                properties:
                  businesses:
                    type: array
                    items: { $ref: "#/components/schemas/CanonicalBusinessSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/control-plane/portfolio/summary:
    get:
      operationId: getCanonicalPortfolio
      summary: Get lightweight canonical business summaries and RLS-resolved portfolio totals.
      responses:
        "200":
          description: Canonical portfolio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalPortfolioSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/control-plane/businesses/{businessId}:
    get:
      operationId: getCanonicalBusiness
      summary: Get one canonical ENTRAL business from PostgreSQL.
      parameters:
        - name: businessId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Canonical business.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [business]
                properties:
                  business: { $ref: "#/components/schemas/CanonicalBusinessSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/control-plane/businesses/{businessId}/full:
    get:
      operationId: getCanonicalBusinessFull
      summary: Get full canonical sections for one RLS-visible business on demand.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      responses:
        "200":
          description: Full canonical business record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalBusinessFullResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/control-plane/events:
    get:
      operationId: listCanonicalPortfolioEvents
      summary: List minimal canonical event metadata used to invalidate UI caches.
      parameters:
        - $ref: "#/components/parameters/AfterSequence"
      responses:
        "200":
          description: Canonical events after the supplied cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalPortfolioEvents" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/control-plane/governance-actions:
    post:
      operationId: createCanonicalGovernanceAction
      summary: Create an idempotent Human-authorized governance proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceActionRequest" }
      responses:
        "201":
          description: Governance proposal recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [action]
                properties:
                  action: { $ref: "#/components/schemas/GovernanceActionRecord" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AfterSequence:
      name: afterSequence
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested record is absent or outside the caller's scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The request does not satisfy the canonical contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The caller lacks the required internal or Human authority.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Idempotency, scope, or expected-version conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    EntityRole:
      type: string
      enum: [ENTRAL, MARSHAL, GENERAL, COMMANDER, SOLDIER]
    EntityStatus:
      type: string
      enum: [BUILDING, ACTIVE, PAUSED, DEGRADED, RETIRED]
    HealthState:
      type: string
      enum: [HEALTHY, WATCH, DEGRADED, CRITICAL, UNKNOWN]
    CanonicalEntitySummary:
      type: object
      additionalProperties: false
      required:
        - entity_id
        - stable_code
        - entity_type
        - name
        - status
        - health
        - parent_id
        - child_count
        - assigned_business_id
        - model_class
        - compute_tier
        - current_mission
        - active_task_count
        - latest_material_result
        - active_alert
        - updated_at
        - version
      properties:
        entity_id: { type: string, format: uuid }
        stable_code: { type: string, minLength: 1 }
        entity_type: { $ref: "#/components/schemas/EntityRole" }
        name: { type: string, minLength: 1 }
        status: { $ref: "#/components/schemas/EntityStatus" }
        health: { $ref: "#/components/schemas/HealthState" }
        parent_id: { type: [string, "null"], format: uuid }
        child_count: { type: integer, minimum: 0 }
        assigned_business_id: { type: [string, "null"], format: uuid }
        model_class: { type: [string, "null"] }
        compute_tier: { type: [string, "null"] }
        current_mission: { type: [string, "null"] }
        active_task_count: { type: integer, minimum: 0 }
        latest_material_result: {}
        active_alert: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    CanonicalBusinessSummary:
      type: object
      additionalProperties: false
      required:
        - business_id
        - stable_code
        - business_name
        - commander_id
        - general_id
        - general_name
        - marshal_id
        - marshal_name
        - status
        - health_state
        - health_score
        - health_drivers
        - revenue_period_start
        - revenue_period_end
        - gross_revenue
        - net_contribution
        - currency
        - capital_available
        - agent_count
        - tool_count
        - automation_count
        - integration_count
        - active_mission_count
        - active_task_count
        - primary_objective
        - top_exception
        - top_recommendation
        - updated_at
        - source_freshness
        - version
      properties:
        business_id: { type: string, format: uuid }
        stable_code: { type: string, minLength: 1 }
        business_name: { type: string, minLength: 1 }
        commander_id: { type: string, format: uuid }
        general_id: { type: string, format: uuid }
        general_name: { type: string, minLength: 1 }
        marshal_id: { type: string, format: uuid }
        marshal_name: { type: string, minLength: 1 }
        status: { type: string, enum: [BUILDING, OPERATING, PAUSED, DEGRADED, RETIRED] }
        health_state: { $ref: "#/components/schemas/HealthState" }
        health_score: { type: [number, "null"], minimum: 0, maximum: 100 }
        health_drivers: { type: array, items: { type: object } }
        revenue_period_start: { type: [string, "null"], format: date-time }
        revenue_period_end: { type: [string, "null"], format: date-time }
        gross_revenue: { type: [number, "null"] }
        net_contribution: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        capital_available: { type: [number, "null"] }
        agent_count: { type: integer, minimum: 0 }
        tool_count: { type: integer, minimum: 0 }
        automation_count: { type: integer, minimum: 0 }
        integration_count: { type: integer, minimum: 0 }
        active_mission_count: { type: integer, minimum: 0 }
        active_task_count: { type: integer, minimum: 0 }
        primary_objective: { type: [string, "null"] }
        top_exception: { type: [string, "null"] }
        top_recommendation: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
        source_freshness: { type: object, additionalProperties: { type: [string, "null"] } }
        version: { type: integer, minimum: 1 }
    CanonicalPortfolioFinancialTotal:
      type: object
      additionalProperties: false
      required: [business_count, businesses_with_financials, capital_available, currency, gross_revenue, net_contribution]
      properties:
        business_count: { type: integer, minimum: 0 }
        businesses_with_financials: { type: integer, minimum: 0 }
        capital_available: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
        gross_revenue: { type: number }
        net_contribution: { type: number }
    CanonicalPortfolioScope:
      type: object
      additionalProperties: false
      required: [label, mode, user_id, visible_business_ids]
      properties:
        label: { type: string, minLength: 1 }
        mode: { type: string, enum: [HUMAN_PORTFOLIO, ASSIGNED_BUSINESSES] }
        user_id: { type: string, format: uuid }
        visible_business_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    CanonicalPortfolioTotals:
      type: object
      additionalProperties: false
      required: [active_commanders, active_soldiers, businesses, financials, health_distribution, unresolved_exceptions]
      properties:
        active_commanders: { type: integer, minimum: 0 }
        active_soldiers: { type: integer, minimum: 0 }
        businesses: { type: integer, minimum: 0 }
        financials:
          type: array
          items: { $ref: "#/components/schemas/CanonicalPortfolioFinancialTotal" }
        health_distribution:
          type: object
          additionalProperties: false
          required: [CRITICAL, DEGRADED, HEALTHY, UNKNOWN, WATCH]
          properties:
            CRITICAL: { type: integer, minimum: 0 }
            DEGRADED: { type: integer, minimum: 0 }
            HEALTHY: { type: integer, minimum: 0 }
            UNKNOWN: { type: integer, minimum: 0 }
            WATCH: { type: integer, minimum: 0 }
        unresolved_exceptions: { type: integer, minimum: 0 }
    CanonicalPortfolioSummary:
      type: object
      additionalProperties: false
      required: [businesses, event_sequence, generated_at, scope, totals]
      properties:
        businesses:
          type: array
          items: { $ref: "#/components/schemas/CanonicalBusinessSummary" }
        event_sequence: { type: integer, minimum: 0 }
        generated_at: { type: string, format: date-time }
        scope: { $ref: "#/components/schemas/CanonicalPortfolioScope" }
        totals: { $ref: "#/components/schemas/CanonicalPortfolioTotals" }
    CanonicalBusinessVersion:
      type: object
      additionalProperties: false
      required: [changed_at, reason, version]
      properties:
        changed_at: { type: string, format: date-time }
        reason: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
    CanonicalBusinessFullRecord:
      type: object
      additionalProperties: false
      required:
        - agents_and_tools
        - aggregate_version
        - decisions_and_changes
        - evidence_ids
        - external_activity
        - financials
        - issues_and_recommendations
        - loaded_at
        - operations
        - overview
        - performance
        - summary
        - version_history
      properties:
        agents_and_tools: {}
        aggregate_version: { type: integer, minimum: 1 }
        decisions_and_changes: {}
        evidence_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        external_activity: {}
        financials: {}
        issues_and_recommendations: {}
        loaded_at: { type: string, format: date-time }
        operations: {}
        overview: {}
        performance: {}
        summary: { $ref: "#/components/schemas/CanonicalBusinessSummary" }
        version_history:
          type: array
          items: { $ref: "#/components/schemas/CanonicalBusinessVersion" }
    CanonicalBusinessFullResponse:
      type: object
      additionalProperties: false
      required: [business]
      properties:
        business: { $ref: "#/components/schemas/CanonicalBusinessFullRecord" }
    CanonicalPortfolioEvent:
      type: object
      additionalProperties: false
      required: [aggregate_id, aggregate_type, aggregate_version, business_id, event_id, event_type, occurred_at, sequence_number]
      properties:
        aggregate_id: { type: string, format: uuid }
        aggregate_type: { type: string, minLength: 1 }
        aggregate_version: { type: [integer, "null"], minimum: 0 }
        business_id: { type: [string, "null"], format: uuid }
        event_id: { type: string, format: uuid }
        event_type: { type: string, minLength: 1 }
        occurred_at: { type: string, format: date-time }
        sequence_number: { type: integer, minimum: 1 }
    CanonicalPortfolioEvents:
      type: object
      additionalProperties: false
      required: [events, next_sequence]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/CanonicalPortfolioEvent" }
        next_sequence: { type: integer, minimum: 0 }
    GovernanceActionRequest:
      type: object
      additionalProperties: false
      required:
        - action_id
        - action_type
        - actor_type
        - actor_id
        - scope
        - target_type
        - target_id
        - business_id
        - requested_outcome
        - reason
        - authority_basis
        - risk_class
        - proposed_changes
        - rollback_plan
        - verification_plan
        - expected_version
        - idempotency_key
        - requested_at
      properties:
        action_id: { type: string, format: uuid }
        action_type:
          type: string
          enum: [CREATE, EDIT, PAUSE, RESUME, RECONFIGURE, DUPLICATE, REASSIGN, RETARGET, RETIRE, RESTORE, ROLLBACK, ISOLATE, REPAIR, BUDGET_CHANGE, MODEL_CHANGE, TOOL_GRANT_CHANGE, POLICY_CHANGE, SCHEDULE_CHANGE]
        actor_type: { type: string, enum: [HUMAN, ENTRAL] }
        actor_id: { type: string, format: uuid }
        scope: { type: object }
        target_type:
          type: string
          enum: [ENTITY, BUSINESS, MISSION, TASK, TOOL_GRANT, SCHEDULE, POLICY, GOVERNANCE_ACTION, SYSTEM]
        target_id: { type: [string, "null"], format: uuid }
        business_id: { type: [string, "null"], format: uuid }
        requested_outcome: { type: string, minLength: 1, maxLength: 2000 }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        authority_basis: {}
        risk_class: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        proposed_changes: {}
        rollback_plan: {}
        verification_plan: {}
        expected_version: { type: integer, minimum: 0 }
        idempotency_key: { type: string, minLength: 12, maxLength: 255 }
        requested_at: { type: string, format: date-time }
    GovernanceActionRecord:
      type: object
      additionalProperties: false
      required: [action_id, action_type, business_id, expected_version, idempotency_key, requested_at, status, target_id, target_type, version]
      properties:
        action_id: { type: string, format: uuid }
        action_type: { type: string }
        business_id: { type: [string, "null"], format: uuid }
        expected_version: { type: integer, minimum: 0 }
        idempotency_key: { type: string }
        requested_at: { type: string, format: date-time }
        status: { type: string, enum: [PROPOSED] }
        target_id: { type: [string, "null"], format: uuid }
        target_type: { type: string }
        version: { type: integer, minimum: 1 }
    MemberOrganizationRole:
      type: string
      enum: [MEMBER, OWNER]
    MemberCommandRank:
      type: string
      enum: [ENTRAL, MARSHAL, GENERAL, COMMANDER, SOLDIER]
    MemberCommandStatus:
      type: string
      enum: [error, idle, offline, thinking, waiting, working]
    MemberCommandNode:
      type: object
      additionalProperties: false
      required: [id, name, parentId, rank, status]
      properties:
        id: { type: string, minLength: 1, maxLength: 160 }
        name: { type: string, minLength: 1, maxLength: 200 }
        parentId: { type: [string, "null"] }
        rank: { $ref: "#/components/schemas/MemberCommandRank" }
        status: { $ref: "#/components/schemas/MemberCommandStatus" }
    MemberCommandHierarchy:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/MemberCommandNode" }
    MemberOrganization:
      type: object
      additionalProperties: false
      required: [id, joinedAt, memberCount, memberLimit, name, role, slug]
      properties:
        id: { type: string }
        joinedAt: { type: string, format: date-time }
        memberCount: { type: integer, minimum: 0 }
        memberLimit: { type: integer, minimum: 1, maximum: 5 }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
        slug: { type: string }
    MemberOrganizationsResponse:
      type: object
      additionalProperties: false
      required: [organizations, user]
      properties:
        organizations:
          type: array
          items: { $ref: "#/components/schemas/MemberOrganization" }
        user:
          type: object
          additionalProperties: false
          required: [email, id, name]
          properties:
            email: { type: string, format: email, maxLength: 320 }
            id: { type: string }
            name: { type: string, minLength: 1, maxLength: 160 }
    MemberAvailability:
      type: object
      additionalProperties: false
      required: [available, reason]
      properties:
        available: { type: boolean, const: false }
        reason: { type: string, minLength: 1, maxLength: 500 }
        state: { type: string, enum: [not_configured] }
    MemberRecord:
      type: object
      additionalProperties: false
      required: [id, joinedAt, name, role]
      properties:
        id: { type: string, minLength: 1 }
        joinedAt: { type: string, format: date-time }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
    MemberOverviewOrganization:
      type: object
      additionalProperties: false
      required: [id, memberCount, memberLimit, name, role, slug]
      properties:
        id: { type: string, minLength: 1 }
        memberCount: { type: integer, minimum: 0 }
        memberLimit: { type: integer, minimum: 1, maximum: 5 }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
        slug: { type: string, minLength: 1, maxLength: 160 }
    MemberTask:
      type: object
      additionalProperties: false
      required: [assignedTo, dueDate, id, status, title, updatedAt]
      properties:
        assignedTo:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1, maxLength: 160 }
        dueDate: { type: [string, "null"], format: date-time }
        id: { type: string, minLength: 1 }
        status: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 500 }
        updatedAt: { type: string, format: date-time }
    MemberTaskSummary:
      type: object
      additionalProperties: false
      required: [done, inProgress, overdue, todo, total]
      properties:
        done: { type: integer, minimum: 0 }
        inProgress: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
        todo: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    MemberBusinessHealth:
      type: object
      additionalProperties: false
      required: [score, status, summary]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [stable, watch, attention] }
        summary: { type: string, minLength: 1, maxLength: 500 }
    MemberObjective:
      type: object
      additionalProperties: false
      required: [id, priority, progress, status, title]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: string, enum: [high, medium, low] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [planned, active, complete] }
        title: { type: string, minLength: 1, maxLength: 180 }
    MemberFinding:
      type: object
      additionalProperties: false
      required: [detail, id, recommendation, severity, title]
      properties:
        detail: { type: string, minLength: 1, maxLength: 1000 }
        id: { type: string, minLength: 1, maxLength: 80 }
        recommendation: { type: string, minLength: 1, maxLength: 1000 }
        severity: { type: string, enum: [information, opportunity, risk] }
        title: { type: string, minLength: 1, maxLength: 180 }
    MemberMonthlyOperatingSummary:
      type: object
      additionalProperties: false
      required: [accomplishments, headline, nextPriorities, period, summary]
      properties:
        accomplishments:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 240 }
        headline: { type: string, minLength: 1, maxLength: 180 }
        nextPriorities:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 240 }
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        summary: { type: string, minLength: 1, maxLength: 1500 }
    MemberWorkspace:
      type: object
      additionalProperties: false
      required:
        - businessHealth
        - findingsAndRecommendations
        - monthlyOperatingSummary
        - objectivesAndPriorities
        - publishedAt
        - version
      properties:
        businessHealth:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberBusinessHealth" }
        commandHierarchy:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberCommandHierarchy" }
        findingsAndRecommendations:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MemberFinding" }
        monthlyOperatingSummary:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberMonthlyOperatingSummary" }
        objectivesAndPriorities:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/MemberObjective" }
        publishedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    MemberOverviewResponse:
      type: object
      additionalProperties: false
      required: [availability, members, organization, recentTasks, taskSummary, workspace]
      properties:
        availability:
          type: object
          additionalProperties: false
          required: [subscription]
          properties:
            subscription: { $ref: "#/components/schemas/MemberAvailability" }
        members:
          type: array
          items: { $ref: "#/components/schemas/MemberRecord" }
        organization: { $ref: "#/components/schemas/MemberOverviewOrganization" }
        recentTasks:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/MemberTask" }
        taskSummary: { $ref: "#/components/schemas/MemberTaskSummary" }
        workspace:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberWorkspace" }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        code: { type: string }
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
