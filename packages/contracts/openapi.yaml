openapi: 3.1.0
info:
  title: ENTRAL implemented API
  version: 1.7.0
  description: >
    Phase 200 interaction contract surface. Only paths with complete backend behavior are
    included. Canonical control-plane paths require internal Admin
    authentication. Member portfolio paths require organization membership;
    PostgreSQL row-level security resolves Human portfolio or assigned scope.
paths:
  /api/v1/member/organizations:
    get:
      operationId: listMemberOrganizations
      summary: List organizations available to the authenticated member.
      responses:
        "200":
          description: Member organization list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOrganizationsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/member/organizations/{organizationId}/overview:
    get:
      operationId: getMemberOrganizationOverview
      summary: Get the approved member-visible organization overview.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Approved organization overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/interaction/business-health:
    get:
      operationId: getMemberBusinessHealth
      summary: Explain canonical business health with explicit truth and evidence context.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: businessId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [EXECUTIVE, OPERATIONAL], default: EXECUTIVE }
      responses:
        "200":
          description: Evidence-grounded business-health explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessHealthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/member/organizations/{organizationId}/interaction/tutorial-progress:
    get:
      operationId: getMemberTutorialProgress
      summary: Resume the authenticated member's server-backed Tutorial progress.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Current Tutorial progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorialProgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMemberTutorialProgress
      summary: Persist Tutorial progress with optimistic concurrency.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorialProgressUpdateRequest" }
      responses:
        "200":
          description: Idempotent Tutorial progress transition and transactional readback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorialProgressMutationResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: resetMemberTutorialProgress
      summary: Reset Tutorial completion without deleting identity or organization context.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorialProgressResetRequest" }
      responses:
        "200":
          description: Idempotent Tutorial reset transition and transactional readback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorialProgressMutationResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/member/organizations/{organizationId}/interaction/analytics:
    post:
      operationId: recordMemberInteractionAnalytics
      summary: Record a bounded content-free Phase 200 interaction event.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteractionAnalyticsEventRequest" }
      responses:
        "202":
          description: Event accepted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/member/organizations/{organizationId}/portfolio/summary:
    get:
      operationId: getMemberCanonicalPortfolio
      summary: Get lightweight canonical business summaries in the member's RLS-visible scope.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Scoped canonical portfolio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalPortfolioSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/businesses/{businessId}/full:
    get:
      operationId: getMemberCanonicalBusinessFull
      summary: Get a full canonical business record on demand when visible to the member.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/BusinessId"
      responses:
        "200":
          description: Full canonical business record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalBusinessFullResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/hierarchy:
    get:
      operationId: getMemberCanonicalHierarchy
      summary: Get one versioned canonical entity hierarchy in the member's RLS-visible scope.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Versioned canonical hierarchy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalHierarchyResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/graph/projection:
    get:
      operationId: getMemberCanonicalGraphProjection
      summary: Get one renderer-neutral projection of the authorized canonical hierarchy.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Versioned, permission-safe canonical graph projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphProjection" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/graph/preferences:
    get:
      operationId: getMemberGraphViewPreferences
      summary: Read canonical defaults or the authenticated member's saved graph overrides.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Current user-and-organization scoped graph preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphViewPreferences" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateMemberGraphViewPreferences
      summary: Persist validated graph overrides using optimistic concurrency and idempotency.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraphViewPreferencesUpdateRequest" }
      responses:
        "200":
          description: Saved preferences and canonical event receipts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphViewPreferencesMutationResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: resetMemberGraphViewPreferences
      summary: Delete or replace a bounded saved-override scope using optimistic concurrency and idempotency.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraphViewPreferencesResetRequest" }
      responses:
        "200":
          description: Reset preferences and canonical event receipts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphViewPreferencesMutationResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/member/organizations/{organizationId}/graph/telemetry:
    post:
      operationId: recordMemberGraphRendererTelemetry
      summary: Record bounded graph performance measurements without customer payloads.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraphRendererTelemetryRequest" }
      responses:
        "202":
          description: Structured graph telemetry accepted by production observability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphRendererTelemetryResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/entities/{entityId}/full:
    get:
      operationId: getMemberCanonicalEntityFull
      summary: Get a full canonical entity record on demand when visible to the member.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Full canonical entity record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalEntityFullResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/entities/{entityId}/actions/{operation}:
    post:
      operationId: executeMemberEntityLifecycleAction
      summary: Atomically pause or resume a member-visible lower entity and return its verified canonical receipt.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/EntityId"
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [pause, resume] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntityLifecycleActionRequest" }
      responses:
        "200":
          description: Lifecycle mutation committed and deterministic readback verification passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityLifecycleActionEnvelope" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/member/organizations/{organizationId}/events:
    get:
      operationId: listMemberCanonicalPortfolioEvents
      summary: List minimal canonical event metadata used to invalidate member portfolio caches.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AfterSequence"
      responses:
        "200":
          description: Scoped canonical events after the supplied cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalPortfolioEvents" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/entral/conversation:
    get:
      operationId: getMemberCanonicalEntralConversation
      summary: Read versioned Human and ENTRAL messages in the member's inherited canonical scope.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: businessId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Scope-bound Human and ENTRAL history with canonical event receipts and evidence references.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalEntralConversation" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/member/organizations/{organizationId}/entral/assistant/messages:
    post:
      operationId: createMemberEntralAssistantMessage
      summary: Generate an audited ENTRAL response from server-resolved member workspace context.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberEntralAssistantMessageRequest" }
      responses:
        "200":
          description: Contextual assistant response with the authoritative resolved scope and AI usage receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberEntralAssistantMessageResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: The authenticated user's AI usage window is exhausted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiUsageLimitEnvelope" }
  /api/v1/member/organizations/{organizationId}/governance-actions:
    post:
      operationId: createMemberCanonicalGovernanceAction
      summary: Record an idempotent Human-authorized governance proposal for a member-visible target.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceActionRequest" }
      responses:
        "201":
          description: Member governance proposal recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [action]
                properties:
                  action: { $ref: "#/components/schemas/GovernanceActionRecord" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/control-plane/hierarchy:
    get:
      operationId: listCanonicalHierarchy
      summary: List canonical ENTRAL hierarchy entities from PostgreSQL.
      responses:
        "200":
          description: Canonical hierarchy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/control-plane/businesses:
    get:
      operationId: listCanonicalBusinesses
      summary: List canonical ENTRAL businesses from PostgreSQL.
      responses:
        "200":
          description: Canonical businesses.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [businesses]
                properties:
                  businesses:
                    type: array
                    items: { $ref: "#/components/schemas/CanonicalBusinessSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/control-plane/portfolio/summary:
    get:
      operationId: getCanonicalPortfolio
      summary: Get lightweight canonical business summaries and RLS-resolved portfolio totals.
      responses:
        "200":
          description: Canonical portfolio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalPortfolioSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/control-plane/businesses/{businessId}:
    get:
      operationId: getCanonicalBusiness
      summary: Get one canonical ENTRAL business from PostgreSQL.
      parameters:
        - name: businessId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Canonical business.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [business]
                properties:
                  business: { $ref: "#/components/schemas/CanonicalBusinessSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/control-plane/businesses/{businessId}/full:
    get:
      operationId: getCanonicalBusinessFull
      summary: Get full canonical sections for one RLS-visible business on demand.
      parameters:
        - $ref: "#/components/parameters/BusinessId"
      responses:
        "200":
          description: Full canonical business record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalBusinessFullResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/control-plane/events:
    get:
      operationId: listCanonicalPortfolioEvents
      summary: List minimal canonical event metadata used to invalidate UI caches.
      parameters:
        - $ref: "#/components/parameters/AfterSequence"
      responses:
        "200":
          description: Canonical events after the supplied cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalPortfolioEvents" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/control-plane/releases/phases/{phase}/evidence:
    get:
      operationId: getPhaseReleaseEvidence
      summary: Read fail-closed, machine-verifiable production evidence for one phase.
      parameters:
        - $ref: "#/components/parameters/Phase"
      responses:
        "200":
          description: Canonical production release, migration, deployment, pull-request, runtime, and gate evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhaseReleaseEvidenceReadback" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/control-plane/entities/{entityId}/full:
    get:
      operationId: getCanonicalEntityFull
      summary: Get a full canonical entity record from PostgreSQL.
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Full canonical entity record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalEntityFullResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/control-plane/entities/{entityId}/actions/{operation}:
    post:
      operationId: executeCanonicalEntityLifecycleAction
      summary: Atomically pause or resume a lower entity through the internal Human control plane.
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [pause, resume] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntityLifecycleActionRequest" }
      responses:
        "200":
          description: Lifecycle mutation committed and deterministic readback verification passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityLifecycleActionEnvelope" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/control-plane/governance-actions:
    post:
      operationId: createCanonicalGovernanceAction
      summary: Create an idempotent Human-authorized governance proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernanceActionRequest" }
      responses:
        "201":
          description: Governance proposal recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [action]
                properties:
                  action: { $ref: "#/components/schemas/GovernanceActionRecord" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    BusinessId:
      name: businessId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntityId:
      name: entityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AfterSequence:
      name: afterSequence
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Phase:
      name: phase
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 10000 }
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested record is absent or outside the caller's scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The request does not satisfy the canonical contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The caller lacks the required internal or Human authority.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Idempotency, scope, or expected-version conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    EntityRole:
      type: string
      enum: [ENTRAL, MARSHAL, GENERAL, COMMANDER, SOLDIER]
    EntityStatus:
      type: string
      enum: [BUILDING, ACTIVE, PAUSED, DEGRADED, RETIRED]
    HealthState:
      type: string
      enum: [HEALTHY, WATCH, DEGRADED, CRITICAL, UNKNOWN]
    GraphEntity:
      type: object
      additionalProperties: false
      required:
        - entity_id
        - organization_id
        - entity_type
        - hierarchy_level
        - authority_tier
        - authority_score
        - parent_id
        - lineage_ids
        - marshal_id
        - domain_id
        - business_id
        - stable_code
        - display_name
        - status
        - health
        - version
      properties:
        entity_id: { type: string, format: uuid }
        organization_id: { type: string, minLength: 1 }
        entity_type: { $ref: "#/components/schemas/EntityRole" }
        hierarchy_level: { type: integer, minimum: 0, maximum: 4 }
        authority_tier: { type: integer, minimum: 0, maximum: 4 }
        authority_score: { type: [number, "null"], minimum: 0, maximum: 1 }
        parent_id: { type: [string, "null"], format: uuid }
        lineage_ids:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: { type: string, format: uuid }
        marshal_id: { type: [string, "null"], format: uuid }
        domain_id: { type: [string, "null"], format: uuid }
        business_id: { type: [string, "null"], format: uuid }
        stable_code: { type: string, minLength: 1, maxLength: 200 }
        display_name: { type: string, minLength: 1, maxLength: 300 }
        status: { $ref: "#/components/schemas/EntityStatus" }
        health: { $ref: "#/components/schemas/HealthState" }
        version: { type: integer, minimum: 1 }
    GraphEdge:
      type: object
      additionalProperties: false
      required: [edge_id, source_id, target_id, relation_type, direction, lineage, status]
      properties:
        edge_id: { type: string, minLength: 1 }
        source_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        relation_type: { type: string, const: HIERARCHY }
        direction: { type: string, const: OUTBOUND }
        lineage: { type: boolean, const: true }
        status: { $ref: "#/components/schemas/EntityStatus" }
    GraphProjection:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - schema_version
        - organization_id
        - projection_version
        - root_id
        - entities
        - edges
        - generated_at
        - evidence_version_reference
      properties:
        contract_version: { type: string, const: "1.0.0" }
        schema_version: { type: integer, const: 1 }
        organization_id: { type: string, minLength: 1 }
        projection_version: { type: integer, minimum: 0 }
        root_id: { type: string, format: uuid }
        entities:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/GraphEntity" }
        edges:
          type: array
          maxItems: 200000
