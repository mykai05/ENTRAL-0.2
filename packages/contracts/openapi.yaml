      properties:
        nodes:
          type: array
          minItems: 1
          maxItems: 5000
          items: { $ref: "#/components/schemas/MemberCommandNode" }
    MemberOrganization:
      type: object
      additionalProperties: false
      required: [id, joinedAt, memberCount, memberLimit, name, role, slug]
      properties:
        id: { type: string }
        joinedAt: { type: string, format: date-time }
        memberCount: { type: integer, minimum: 0 }
        memberLimit: { type: integer, minimum: 1, maximum: 5 }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
        slug: { type: string }
    MemberOrganizationsResponse:
      type: object
      additionalProperties: false
      required: [organizations, user]
      properties:
        organizations:
          type: array
          items: { $ref: "#/components/schemas/MemberOrganization" }
        user:
          type: object
          additionalProperties: false
          required: [email, id, name]
          properties:
            email: { type: string, format: email, maxLength: 320 }
            id: { type: string }
            name: { type: string, minLength: 1, maxLength: 160 }
    MemberAvailability:
      type: object
      additionalProperties: false
      required: [available, reason]
      properties:
        available: { type: boolean, const: false }
        reason: { type: string, minLength: 1, maxLength: 500 }
        state: { type: string, enum: [not_configured] }
    MemberRecord:
      type: object
      additionalProperties: false
      required: [id, joinedAt, name, role]
      properties:
        id: { type: string, minLength: 1 }
        joinedAt: { type: string, format: date-time }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
    MemberOverviewOrganization:
      type: object
      additionalProperties: false
      required: [id, memberCount, memberLimit, name, role, slug]
      properties:
        id: { type: string, minLength: 1 }
        memberCount: { type: integer, minimum: 0 }
        memberLimit: { type: integer, minimum: 1, maximum: 5 }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: "#/components/schemas/MemberOrganizationRole" }
        slug: { type: string, minLength: 1, maxLength: 160 }
    MemberTask:
      type: object
      additionalProperties: false
      required: [assignedTo, dueDate, id, status, title, updatedAt]
      properties:
        assignedTo:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1, maxLength: 160 }
        dueDate: { type: [string, "null"], format: date-time }
        id: { type: string, minLength: 1 }
        status: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 500 }
        updatedAt: { type: string, format: date-time }
    MemberTaskSummary:
      type: object
      additionalProperties: false
      required: [done, inProgress, overdue, todo, total]
      properties:
        done: { type: integer, minimum: 0 }
        inProgress: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
        todo: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    MemberBusinessHealth:
      type: object
      additionalProperties: false
      required: [score, status, summary]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [stable, watch, attention] }
        summary: { type: string, minLength: 1, maxLength: 500 }
    MemberObjective:
      type: object
      additionalProperties: false
      required: [id, priority, progress, status, title]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        priority: { type: string, enum: [high, medium, low] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [planned, active, complete] }
        title: { type: string, minLength: 1, maxLength: 180 }
    MemberFinding:
      type: object
      additionalProperties: false
      required: [detail, id, recommendation, severity, title]
      properties:
        detail: { type: string, minLength: 1, maxLength: 1000 }
        id: { type: string, minLength: 1, maxLength: 80 }
        recommendation: { type: string, minLength: 1, maxLength: 1000 }
        severity: { type: string, enum: [information, opportunity, risk] }
        title: { type: string, minLength: 1, maxLength: 180 }
    MemberMonthlyOperatingSummary:
      type: object
      additionalProperties: false
      required: [accomplishments, headline, nextPriorities, period, summary]
      properties:
        accomplishments:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 240 }
        headline: { type: string, minLength: 1, maxLength: 180 }
        nextPriorities:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 240 }
        period: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        summary: { type: string, minLength: 1, maxLength: 1500 }
    MemberWorkspace:
      type: object
      additionalProperties: false
      required:
        - businessHealth
        - findingsAndRecommendations
        - monthlyOperatingSummary
        - objectivesAndPriorities
        - publishedAt
        - version
      properties:
        businessHealth:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberBusinessHealth" }
        commandHierarchy:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberCommandHierarchy" }
        findingsAndRecommendations:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MemberFinding" }
        monthlyOperatingSummary:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberMonthlyOperatingSummary" }
        objectivesAndPriorities:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/MemberObjective" }
        publishedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    MemberOverviewResponse:
      type: object
      additionalProperties: false
      required: [availability, members, organization, recentTasks, taskSummary, workspace]
      properties:
        availability:
          type: object
          additionalProperties: false
          required: [subscription]
          properties:
            subscription: { $ref: "#/components/schemas/MemberAvailability" }
        members:
          type: array
          items: { $ref: "#/components/schemas/MemberRecord" }
        organization: { $ref: "#/components/schemas/MemberOverviewOrganization" }
        recentTasks:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/MemberTask" }
        taskSummary: { $ref: "#/components/schemas/MemberTaskSummary" }
        workspace:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/MemberWorkspace" }
    BusinessHealthResponse:
      type: object
      additionalProperties: false
      required: [contract_version, schema_version, identity, mode, health, evidence, truth]
      properties:
        contract_version: { type: string, const: "1.0.0" }
        schema_version: { type: integer, const: 1 }
        identity:
          type: object
          additionalProperties: false
          required: [name, provider_independent, release_version, voice_version]
          properties:
            name: { type: string, const: ENTRAL }
            provider_independent: { type: boolean, const: true }
            release_version: { type: string, const: phase-200 }
            voice_version: { type: string, const: entral-voice-v1 }
        mode: { type: string, enum: [EXECUTIVE, OPERATIONAL] }
        health:
          type: object
          additionalProperties: false
          required: [drivers, score, state, summary, value_status]
          properties:
            drivers: { type: array, items: {} }
            score: { oneOf: [{ type: "null" }, { type: number, minimum: 0, maximum: 100 }] }
            state: { type: string, enum: [HEALTHY, WATCH, DEGRADED, CRITICAL, UNKNOWN] }
            summary: { type: string, minLength: 1, maxLength: 1000 }
            value_status: { type: string, enum: [RECORDED, UNAVAILABLE] }
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [evidence_id, freshness, label, observed_at, source_id, source_type]
            properties:
              evidence_id: { type: string }
              freshness: { type: string, enum: [CURRENT, STALE, UNKNOWN] }
              label: { type: string }
              observed_at: { type: string, format: date-time }
              source_id: { type: string }
              source_type: { type: string, enum: [CANONICAL_PORTFOLIO, MEMBER_WORKSPACE] }
        truth:
          type: object
          additionalProperties: false
          required: [assumptions, business_id, business_scope, confidence, evidence_freshness, next_action, organization_id]
          properties:
            assumptions: { type: array, items: { type: string } }
            business_id: { oneOf: [{ type: "null" }, { type: string, format: uuid }] }
            business_scope: { type: string }
            confidence: { type: string, enum: [RECORDED, INFERRED, UNAVAILABLE] }
            evidence_freshness:
              type: object
              additionalProperties: false
              required: [observed_at, state]
              properties:
                observed_at: { type: string, format: date-time }
                state: { type: string, enum: [CURRENT, STALE, UNKNOWN] }
            next_action:
              type: object
              additionalProperties: false
              required: [action_id, available, label, unavailable_reason]
              properties:
                action_id: { oneOf: [{ type: "null" }, { type: string }] }
                available: { type: boolean }
                label: { type: string }
                unavailable_reason: { oneOf: [{ type: "null" }, { type: string }] }
            organization_id: { type: string }
    TutorialProgress:
      type: object
      additionalProperties: false
      required: [contract_version, schema_version, release_version, user_id, organization_id, role_context, plan_context, business_model_context, commander_pack_context, mode, completed_anchor_ids, current_anchor_id, first_launch_seen, revision, started_at, completed_at, updated_at]
      properties:
        contract_version: { type: string, const: "1.0.0" }
        schema_version: { type: integer, const: 1 }
        release_version: { type: string, const: phase-200 }
        user_id: { type: string }
        organization_id: { type: string }
        role_context: { type: string, enum: [MEMBER, OWNER] }
        plan_context: { oneOf: [{ type: "null" }, { type: string }] }
        business_model_context: { oneOf: [{ type: "null" }, { type: string }] }
        commander_pack_context: { oneOf: [{ type: "null" }, { type: string }] }
        mode: { type: string, enum: [beginner, advanced] }
        completed_anchor_ids:
          type: array
          uniqueItems: true
          items: { type: string, enum: [command-overview, businesses-overview, universe-navigation, infrastructure-records, entral-assistant] }
        current_anchor_id:
          oneOf:
            - { type: "null" }
            - { type: string, enum: [command-overview, businesses-overview, universe-navigation, infrastructure-records, entral-assistant] }
        first_launch_seen: { type: boolean }
        revision: { type: integer, minimum: 1 }
        started_at: { type: string, format: date-time }
        completed_at: { oneOf: [{ type: "null" }, { type: string, format: date-time }] }
        updated_at: { type: string, format: date-time }
    TutorialProgressUpdateRequest:
      type: object
      additionalProperties: false
      required: [contract_version, schema_version, idempotency_key, expected_revision, mode, completed_anchor_ids, current_anchor_id, first_launch_seen]
      properties:
        contract_version: { type: string, const: "1.0.0" }
        schema_version: { type: integer, const: 1 }
        idempotency_key: { type: string, minLength: 12, maxLength: 255 }
        expected_revision: { type: integer, minimum: 0 }
        mode: { type: string, enum: [beginner, advanced] }
        completed_anchor_ids:
          type: array
          uniqueItems: true
          items: { type: string, enum: [command-overview, businesses-overview, universe-navigation, infrastructure-records, entral-assistant] }
        current_anchor_id:
          oneOf:
            - { type: "null" }
            - { type: string, enum: [command-overview, businesses-overview, universe-navigation, infrastructure-records, entral-assistant] }
        first_launch_seen: { type: boolean }
    TutorialProgressResetRequest:
      type: object
      additionalProperties: false
      required: [contract_version, schema_version, idempotency_key, expected_revision]
      properties:
        contract_version: { type: string, const: "1.0.0" }
        schema_version: { type: integer, const: 1 }
        idempotency_key: { type: string, minLength: 12, maxLength: 255 }
        expected_revision: { type: integer, minimum: 0 }
    TutorialProgressMutationResponse:
      type: object
      additionalProperties: false
      required: [progress, idempotent_replay, transition]
      properties:
        progress: { $ref: "#/components/schemas/TutorialProgress" }
        idempotent_replay: { type: boolean }
        transition:
          type: object
          additionalProperties: false
          required: [action, actor_user_id, authorization, budget, business_id, evidence, failure_behavior, idempotency_key, occurred_at, organization_id, prior_revision, reconciliation, release_version, resulting_revision, reversible, tenant_id, verification]
          properties:
            action: { type: string, enum: [UPDATE, RESET] }
            actor_user_id: { type: string }
            authorization: { type: string, enum: [AUTHENTICATED_MEMBER, AUTHENTICATED_OWNER] }
            budget:
              type: object
              additionalProperties: false
              required: [kind, amount_cents]
              properties:
                kind: { type: string, const: NO_EXTERNAL_SPEND }
                amount_cents: { type: integer, const: 0 }
            business_id: { type: "null" }
            evidence:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                additionalProperties: false
                required: [source_id, source_type]
                properties:
                  source_id: { type: string }
                  source_type: { type: string, const: TUTORIAL_PROGRESS }
            failure_behavior: { type: string, const: CONFLICT_NO_WRITE }
            idempotency_key: { type: string, minLength: 12, maxLength: 255 }
            occurred_at: { type: string, format: date-time }
            organization_id: { type: string }
            prior_revision: { type: integer, minimum: 1 }
            reconciliation: { type: string, const: OPTIMISTIC_REVISION_AND_READBACK }
            release_version: { type: string, const: phase-200 }
            resulting_revision: { type: integer, minimum: 2 }
            reversible: { type: boolean, const: true }
            tenant_id: { type: string }
            verification: { type: string, const: TRANSACTIONAL_READ_AFTER_WRITE }
    InteractionAnalyticsEventRequest:
      type: object
      additionalProperties: false
      required: [contract_version, schema_version, event_id, event_type, occurred_at, route, control_id, reason_code]
      properties:
        contract_version: { type: string, const: "1.0.0" }
        schema_version: { type: integer, const: 1 }
        event_id: { type: string, format: uuid }
        event_type: { type: string, enum: [ROUTE_FAILURE, TUTORIAL_ABANDONED, HELP_USED, CONTROL_FAILED] }
        occurred_at: { type: string, format: date-time }
        route: { type: string, pattern: '^/' }
        control_id: { oneOf: [{ type: "null" }, { type: string, maxLength: 120 }] }
        reason_code: { oneOf: [{ type: "null" }, { type: string, maxLength: 120 }] }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        code: { type: string }
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
