<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1280 640">
  <title id="title">Phase 195 deterministic dual graph visual golden</title>
